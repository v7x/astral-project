name: parser-fuzz

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run parser fuzz corpus
        run: uv run python scripts/parser_fuzz.py
