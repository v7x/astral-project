[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "astral-project"
version = "0.1.0"
description = "Least-authority remote-file access for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Astral Project contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "cbor2==6.1.3",
    "cryptography==49.0.0",
]

[project.optional-dependencies]
fuse = [
    "pyfuse3==3.5.0",
    "trio==0.31.0",
]

[project.scripts]
astral-project = "astral_project.cli:main"
aspr = "astral_project.cli:main"

[dependency-groups]
dev = [
  "coverage==7.13.4",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astral_project"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["astral_project"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
